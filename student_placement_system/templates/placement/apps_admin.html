{% extends 'placement/base.html' %}{% block content %}<h2>Applications</h2>{% for a in apps %}<form method="post" class="card p-3 mb-2 d-flex flex-row gap-3 align-items-center">{% csrf_token %}<input type="hidden" name="app_id" value="{{a.pk}}"><span class="flex-grow-1">{{a.student}} · {{a.job}} · {{a.get_status_display}}</span><select class="form-select w-auto" name="status">{% for val,label in a.STATUS %}<option value="{{val}}" {% if val == a.status %}selected{% endif %}>{{label}}</option>{% endfor %}</select><button class="btn btn-primary btn-sm">Update</button></form>{% empty %}<p>No applications yet.</p>{% endfor %}{% endblock %}
