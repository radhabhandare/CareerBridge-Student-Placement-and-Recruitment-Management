{% extends 'placement/base.html' %}{% block content %}<h2>My Applications</h2><table class="table bg-white"><tr><th>Job</th><th>Company</th><th>Status</th><th>Applied</th></tr>{% for a in apps %}<tr><td>{{a.job.title}}</td><td>{{a.job.company}}</td><td>{{a.get_status_display}}</td><td>{{a.applied_at|date:'d M Y'}}</td></tr>{% empty %}<tr><td colspan="4">No applications yet.</td></tr>{% endfor %}</table>{% endblock %}
