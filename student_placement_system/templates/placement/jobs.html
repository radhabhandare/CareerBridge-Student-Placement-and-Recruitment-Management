{% extends 'placement/base.html' %}{% block content %}<h2>Find Jobs</h2><form class="row g-2 mb-3"><div class="col"><input class="form-control" name="q" value="{{q}}" placeholder="Job title or skill"></div><div class="col"><input class="form-control" name="location" value="{{location}}" placeholder="Location"></div><div class="col-auto"><button class="btn btn-primary">Search</button></div></form>{% for j in jobs %}<div class="card p-3 mb-3"><h5>{{j.title}}</h5><p>{{j.company}} · {{j.location}} · {{j.package_lpa|default:'Not disclosed'}} LPA</p><a href="{% url 'job_detail' j.pk %}">View details</a></div>{% empty %}<p>No jobs found.</p>{% endfor %}{% endblock %}
