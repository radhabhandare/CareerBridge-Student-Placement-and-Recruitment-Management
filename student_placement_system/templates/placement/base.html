
{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CareerBridge</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navy">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                CareerBridge
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link" href="{% url 'home' %}">
                        Home
                    </a>

                    <!-- Always visible -->
                    <a class="nav-link" href="{% url 'login' %}">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Student Login
                    </a>

                    <a class="nav-link" href="{% url 'register' %}">
                        <i class="bi bi-person-plus"></i>
                        Student Registration
                    </a>

                    <!-- Visible only after login -->
                    {% if user.is_authenticated %}

                        <a class="nav-link" href="{% url 'dashboard' %}">
                            <i class="bi bi-speedometer2"></i>
                            Dashboard
                        </a>

                        <a class="nav-link" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right"></i>
                            Logout
                        </a>

                    {% endif %}

                </div>

            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">

        {% for m in messages %}
            <div class="alert alert-info">
                {{ m }}
            </div>
        {% endfor %}

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer class="navy text-white p-4 mt-5 text-center">
        CareerBridge · Student Placement and Recruitment Management
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
